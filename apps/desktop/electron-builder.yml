# Packaging for agenterm desktop. The daemon ships as a resource staged by
# scripts/stage-daemon.mjs and runs with ELECTRON_RUN_AS_NODE.
appId: dev.agenterm.app
productName: agenterm
copyright: Copyright © agenterm contributors
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/agentermd
    to: agentermd
  - from: resources/icon.png
    to: icon.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Signing and notarization run when CSC_LINK / CSC_KEY_PASSWORD and APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set; otherwise builds are unsigned.
dmg:
  artifactName: agenterm-${version}-${arch}.${ext}
win:
  icon: resources/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  category: Development
  target:
    - AppImage
    - deb
  maintainer: agenterm
publish:
  provider: github
