name: release

# Push a tag like v0.2.0 (after `node scripts/set-version.mjs 0.2.0` and a commit)
# to build the macOS app, publish a GitHub release, and publish the CLI to npm.
# See docs/RELEASING.md for npm trusted publishing and the optional signing secrets.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  mac:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: node scripts/set-version.mjs --check "$GITHUB_REF_NAME"
      # Fails early when CHANGELOG.md has no section for this version.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/stage-daemon.mjs --arch arm64,x64 --verify
        working-directory: apps/desktop
      - name: electron-builder
        working-directory: apps/desktop
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Signs with a Developer ID and notarizes only when those secrets exist;
        # otherwise the app is ad-hoc signed (see the README's first-launch note).
        run: |
          if [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            if [ -n "$MAC_APPLE_ID" ]; then
              export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            fi
          fi
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          # The app updates itself from the zip for its architecture (electron/main/updater.ts).
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

  github:
    name: GitHub release
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* --title "agenterm $version" --notes-file notes.md --verify-tag

  npm:
    name: npm package
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=agenterm
      # Trusted publishing: npm checks this workflow's OIDC identity, so there is
      # no token to store. It needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - working-directory: apps/cli
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "agenterm@$version" version >/dev/null 2>&1; then
            echo "agenterm@$version is already on npm."
            exit 0
          fi
          npm publish --access public
