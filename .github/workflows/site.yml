name: site

# Deploys apps/site to agenterm.entange.com when it changes on main. Needs the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without them the job
# only builds. See docs/RELEASING.md. `bun run deploy` in apps/site does the same
# by hand.

on:
  push:
    branches: [main]
    paths: ['apps/site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/site
      - name: wrangler deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret: built the site, skipped the deploy."
            exit 0
          fi
          bunx wrangler deploy
