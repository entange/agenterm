name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: node scripts/set-version.mjs --check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  package:
    name: package smoke (macOS)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Boots the staged daemon under Electron's Node and runs a real terminal through it.
      - run: node scripts/stage-daemon.mjs --verify
        working-directory: apps/desktop
      - run: npx electron-builder --dir --publish never
        working-directory: apps/desktop
      # The agenterm command inside the app, through a link like the one the app adds to /usr/local/bin,
      # with no Node.js on the PATH: it starts the app's daemon and runs a task.
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/release/mac-arm64/agenterm.app/Contents/Resources/agentermd/bin/agenterm" "$RUNNER_TEMP/bin/agenterm"
          export PATH="$RUNNER_TEMP/bin:/usr/bin:/bin" AGENTERM_DATA_DIR="$RUNNER_TEMP/agenterm-app" AGENTERM_PORT=37401
          agenterm run --id smoke "echo app-command-ok"
          sleep 1
          agenterm logs smoke | grep app-command-ok
          agenterm daemon stop
        working-directory: apps/desktop
      # The npm package: pack it, install it globally, and run a task through it.
      - run: |
          npm pack
          npm install -g ./agenterm-*.tgz
          export AGENTERM_DATA_DIR="$RUNNER_TEMP/agenterm" AGENTERM_PORT=37400
          agenterm run --id smoke "echo npm-package-ok"
          sleep 1
          agenterm logs smoke | grep npm-package-ok
          agenterm daemon stop
        working-directory: apps/cli
